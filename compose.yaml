services:
  geth:
    image: ethereum/client-go:v1.17.10
    command:
      - --dev
      - --datadir=/data
      - --http
      - --http.addr=0.0.0.0
      - --http.port=8545
      - --http.api=eth,net,web3
      - --http.vhosts=localhost,127.0.0.1
      - --http.corsdomain=http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "127.0.0.1:8545:8545"
    volumes:
      - geth-data:/data
    healthcheck:
      test: ["CMD", "geth", "attach", "--exec", "eth.blockNumber", "/data/geth.ipc"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

volumes:
  geth-data:
